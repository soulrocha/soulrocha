<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 300" width="326" height="300"><title>Polestar · 18 PRs aceitos: Traduzi para português do Brasil o addon de guias de WoW (interface e guias de todas as classes) e corrigi a janela de guias.</title><style>text{font-family:'Segoe UI',system-ui,-apple-system,sans-serif}.mono{font-family:ui-monospace,'Cascadia Code',Consolas,monospace}.tw{transform-box:fill-box;transform-origin:center;animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.1;transform:scale(.5)}50%{opacity:1;transform:scale(1.2)}}.shimmer{animation:shimmer 6s linear infinite}@keyframes shimmer{to{stroke-dashoffset:-1000}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}.shine{animation:shine 4.5s ease-in-out infinite}@keyframes shine{0%,55%{transform:translateX(-300px) skewX(-20deg)}100%{transform:translateX(1300px) skewX(-20deg)}}.float{animation:float 3.4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-5px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.tw{opacity:.7}.shine{display:none}}</style><defs><linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141a2d"/><stop offset="1" stop-color="#262d4a"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="r"><rect width="326" height="300" rx="14"/></clipPath></defs><g clip-path="url(#r)"><rect width="326" height="300" fill="#1b2138"/><text x="18" y="40" font-size="13" font-weight="700" letter-spacing="3" fill="#9aa4bf">CONTRIBUIÇÃO</text><rect x="225.5" y="22" width="86.5" height="24" rx="12" fill="#7ee787" fill-opacity=".14" stroke="#7ee787" stroke-opacity=".6"/><circle class="pulse" cx="239.5" cy="34" r="4" fill="#7ee787"/><circle cx="239.5" cy="34" r="4" fill="#7ee787"/><text x="251.5" y="38.5" font-size="12.5" font-weight="600" fill="#7ee787">aceitos</text><path d="M163 58 L171 91 L204 99 L171 107 L163 140 L155 107 L122 99 L155 91 Z" fill="#7ee787" fill-opacity=".85" filter="url(#glow)"/><text x="18" y="160" font-size="18" font-weight="700" fill="#7ee787">Polestar · 18 PRs aceitos</text><text x="18" y="184" font-size="13" fill="#e6edf3" fill-opacity=".82">Traduzi para português do Brasil o addon</text><text x="18" y="202" font-size="13" fill="#e6edf3" fill-opacity=".82">de guias de WoW (interface e guias de</text><text x="18" y="220" font-size="13" fill="#e6edf3" fill-opacity=".82">todas as classes) e corrigi a janela de</text><text x="18" y="238" font-size="13" fill="#e6edf3" fill-opacity=".82">guias.</text><rect x="18" y="262" width="56" height="22" rx="11" fill="#7ee787" fill-opacity=".12" stroke="#7ee787" stroke-opacity=".45"/><text x="46" y="277" text-anchor="middle" font-size="12" fill="#7ee787" class="mono">pt-BR</text><rect x="82" y="262" width="41.6" height="22" rx="11" fill="#7ee787" fill-opacity=".12" stroke="#7ee787" stroke-opacity=".45"/><text x="102.8" y="277" text-anchor="middle" font-size="12" fill="#7ee787" class="mono">Lua</text></g><rect x="1" y="1" width="324" height="298" rx="13" fill="none" stroke="#d9b26a" stroke-opacity=".35" stroke-width="1.5"/><rect class="shimmer" x="1" y="1" width="324" height="298" rx="13" fill="none" stroke="#f2c14e" stroke-width="2" pathLength="1000" stroke-dasharray="70 930" filter="url(#glow)"/></svg>