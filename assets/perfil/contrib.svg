<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 300" width="326" height="300"><title>Coucou, PR #879: Contribuição open source: levei ao Windows a escolha de onde a ilha fica, em qualquer monitor.</title><style>text{font-family:'Segoe UI',system-ui,-apple-system,sans-serif}.mono{font-family:ui-monospace,'Cascadia Code',Consolas,monospace}.tw{transform-box:fill-box;transform-origin:center;animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.1;transform:scale(.5)}50%{opacity:1;transform:scale(1.2)}}.shimmer{animation:shimmer 6s linear infinite}@keyframes shimmer{to{stroke-dashoffset:-1000}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}.shine{animation:shine 4.5s ease-in-out infinite}@keyframes shine{0%,55%{transform:translateX(-300px) skewX(-20deg)}100%{transform:translateX(1300px) skewX(-20deg)}}.float{animation:float 3.4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-5px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.tw{opacity:.7}.shine{display:none}}</style><defs><linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141a2d"/><stop offset="1" stop-color="#262d4a"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="r"><rect width="326" height="300" rx="14"/></clipPath></defs><g clip-path="url(#r)"><rect width="326" height="300" fill="#1b2138"/><text x="18" y="40" font-size="13" font-weight="700" letter-spacing="3" fill="#9aa4bf">CONTRIBUIÇÃO</text><rect x="210.5" y="22" width="101.5" height="24" rx="12" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".6"/><circle class="pulse" cx="224.5" cy="34" r="4" fill="#a78bfa"/><circle cx="224.5" cy="34" r="4" fill="#a