<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" width="280" height="200" overflow="visible"><style>.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-2px)}}.blink{animation:blink 4.4s infinite}@keyframes blink{0%,94%,100%{opacity:1}96%{opacity:0}}.shk{animation:shk .45s ease-in-out infinite}@keyframes shk{25%{transform:translateX(-1.8px)}75%{transform:translateX(1.8px)}}.flt{animation:flt 2.8s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-4px)}}.glw{animation:glw 2s ease-in-out infinite}@keyframes glw{50%{opacity:.3}}.cyc{opacity:0;animation:cyc 6s infinite}@keyframes cyc{0%{opacity:0}4%,22%{opacity:1}27%,100%{opacity:0}}.zz{opacity:0;animation:zz 3s ease-out infinite}@keyframes zz{0%{opacity:0;transform:none}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-16px)}}.puff{opacity:0;animation:puff 2.4s ease-out infinite}@keyframes puff{0%{opacity:0;transform:none}20%{opacity:.55}100%{opacity:0;transform:translate(4px,-22px) scale(1.6)}}.sway{transform-box:view-box;animation:sway 1.8s ease-in-out infinite}@keyframes sway{50%{transform:rotate(9deg)}}.turn{transform-box:view-box;animation:turn 1.4s ease-in-out infinite}@keyframes turn{50%{transform:rotate(-28deg)}}.slash{transform-box:view-box;animation:slash 1.3s cubic-bezier(.6,0,.3,1) infinite}@keyframes slash{0%,30%{transform:rotate(-62deg)}55%,100%{transform:rotate(38deg)}}.trail{opacity:0;animation:trail 1.3s ease-out infinite}@keyframes trail{0%,42%{opacity:0}52%{opacity:.85}80%,100%{opacity:0}}.dash{animation:dash 4s linear infinite}@keyframes dash{to{stroke-dashoffset:-40}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.3);opacity:.75}}.zap{animation:zap 1.2s steps(1) infinite}@keyframes zap{0%,100%{opacity:0}10%,30%{opacity:1}35%{opacity:0}60%,70%{opacity:1}75%{opacity:0}}.lit{animation:lit 4s infinite}@keyframes lit{0%,100%{fill-opacity:.3}8%,24%{fill-opacity:1}34%{fill-opacity:.3}}.vib{animation:vib .16s linear infinite}@keyframes vib{50%{transform:translateX(.9px)}}.dizzy{transform-box:view-box;transform-origin:70px 40px;animation:dizzy 2.2s linear infinite}@keyframes dizzy{to{transform:rotate(360deg)}}.flip{transform-box:fill-box;transform-origin:0% 50%;animation:flip 2.6s ease-in-out infinite}@keyframes flip{0%,45%{transform:scaleX(1)}60%,100%{transform:scaleX(-1)}}.hit{animation:hit 1.3s ease-out infinite}@keyframes hit{0%,50%{transform:none;opacity:1}56%{transform:translate(4px,-2px) rotate(25deg) scale(.8);opacity:1}75%{transform:translate(8px,2px) rotate(70deg) scale(.6);opacity:0}100%{opacity:0}}.stamp{animation:stamp 1.8s ease-in-out infinite}@keyframes stamp{0%,20%{transform:translateY(-10px)}40%,55%{transform:translateY(4px)}75%,100%{transform:translateY(-10px)}}.sealA{opacity:0;animation:sealA 3.6s infinite}@keyframes sealA{0%,20%{opacity:0}23%,46%{opacity:1}50%,100%{opacity:0}}.sealB{opacity:0;animation:sealB 3.6s infinite}@keyframes sealB{0%,70%{opacity:0}73%,96%{opacity:1}100%{opacity:0}}.write{stroke-dasharray:24;stroke-dashoffset:24;animation:write 3.2s linear infinite}@keyframes write{55%,100%{stroke-dashoffset:0}}.flap{transform-box:fill-box;transform-origin:50% 0%;animation:flap .35s ease-in-out infinite}@keyframes flap{50%{transform:scaleY(.4)}}.arrive{animation:arrive 4.5s ease-out infinite}@keyframes arrive{0%{transform:translate(40px,-40px);opacity:0}12%{opacity:1}50%,100%{transform:none;opacity:1}}.ants{animation:ants .8s linear infinite}@keyframes ants{to{stroke-dashoffset:-10}}.carry{animation:carry 3s ease-in-out infinite}@keyframes carry{0%,25%{transform:none;opacity:1}75%{transform:translate(-88px,42px) scale(.5);opacity:1}82%,100%{transform:translate(-88px,42px) scale(.5);opacity:0}}.siren{animation:siren .6s steps(1) infinite}@keyframes siren{50%{opacity:.2}}.poof{transform-box:fill-box;transform-origin:center;animation:poof 4s ease-out infinite}@keyframes poof{0%{opacity:0;transform: